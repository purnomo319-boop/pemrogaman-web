<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jasa Fotografi</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>Jasa Fotografi</h2>
    <div>
        <a href="#">Home</a>
        <a href="#">Galeri</a>
        <a href="#">Contact</a>
    </div>
</header>

<section class="hero">
    <h1>Abadikan Momen Terbaik Anda</h1>
    <p>Wedding | Prewedding | Event | Wisuda</p>
</section>

<section class="body-section">
    <h2>Galeri Kami</h2>

    <div class="gallery">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486">
            <h3>Wedding</h3>
            <p>Mulai Rp 2.000.000</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1519741497674-611481863552">
            <h3>Prewedding</h3>
            <p>Mulai Rp 1.500.000</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70">
            <h3>Wisuda</h3>
            <p>Mulai Rp 500.000</p>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
            <h3>Event</h3>
            <p>Mulai Rp 1.000.000</p>
        </div>

    </div>
</section>

<section class="contact">
    <h2>Hubungi Kami</h2>

    <input type="text" placeholder="Nama"><br>
    <input type="email" placeholder="Email"><br>
    <textarea placeholder="Pesan"></textarea><br>

    <button>Kirim</button>
</section>

<footer>
    <p>© 2026 Jasa Fotografi | Purnomo</p>
</footer>

</body>
</html>
