<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookStore Premium</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header>

  <div class="logo">
    📚 BookStore Premium
  </div>

  <nav id="nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="login.html">Login</a>
  </nav>

  <!-- JAM -->
  <div id="clock"></div>

  <!-- DARK MODE -->
  <button class="dark-btn" onclick="toggleDarkMode()">
    🌙
  </button>

  <!-- CART -->
  <div class="cart">
    🛒 <span id="cart-count">0</span>
  </div>

  <!-- MENU -->
  <div class="menu-toggle" onclick="toggleMenu()">
    ☰
  </div>

</header>

<!-- HERO -->
<section class="hero">
  <h1>Temukan Buku Terbaik 📖</h1>
  <p>Belanja mudah, cepat, dan modern</p>
</section>

<!-- SLIDER -->
<div class="slider">
  <img id="slide" src="https://picsum.photos/1200/400?1">
</div>

<!-- MAIN -->
<main>

  <h2 class="title">
    Produk Buku
  </h2>

  <!-- SEARCH -->
  <input type="text" id="search" placeholder="Cari buku...">

  <!-- CARD 1 -->
<div class="card">

  <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=800&q=80">

  <h3>HTML & CSS</h3>

  <p>⭐⭐⭐⭐⭐</p>

  <p>Rp 50.000</p>

  <button class="love">
    ❤️
  </button>

  <button onclick="addToCart(50000)">
    Tambah ke Keranjang
  </button>

    </div>

   <!-- CARD 2 -->
<div class="card">

  <img src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=800&q=80">

  <h3>JavaScript</h3>

  <p>⭐⭐⭐⭐⭐</p>

  <p>Rp 75.000</p>

  <button class="love">
    ❤️
  </button>

     <button onclick="addToCart(75000)">
    Tambah ke Keranjang
  </button>

</div>

   <!-- CARD 3 -->
<div class="card">

  <img src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=800&q=80">

  <h3>UI/UX Design</h3>

  <p>⭐⭐⭐⭐⭐</p>

  <p>Rp 90.000</p>

  <button class="love">
    ❤️
  </button>

      <button onclick="addToCart(90000)">
    Tambah ke Keranjang
  </button>

</div>

  </div>

  <!-- CHECKOUT -->
  <div class="checkout-box">

    <button onclick="checkout()">
      Checkout
    </button>

  </div>

</main>

<!-- TOAST -->
<div id="toast">
  Produk ditambahkan!
</div>

<!-- MUSIC -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- FOOTER -->
<footer>
  <p>&copy; 2026 BookStore Premium</p>
</footer>

<script src="script.js"></script>

</body>
</html>
