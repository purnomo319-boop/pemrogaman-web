<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Rental</title>
    <link rel="stylesheet" href="carental.css">
</head>
<body>

    <!-- HEADER -->
    <h1>Car Rental</h1>
    <p>Find the perfect car for your next adventure</p>
    <hr>

    <!-- FORM -->
    <h2>Search Car</h2>

    <label>Rental Location:</label>
    <select>
        <option>Yogyakarta</option>
        <option>Bali</option>
    </select>

    <br><br>

    <label>Rental Start Date:</label>
    <input type="date">

    <br><br>

    <label>Rental End Date:</label>
    <input type="date">

    <br><br>

    <button>Search</button>

    <hr>

    <!-- CAR LIST -->
    <h2>Car List</h2>

    <div>
        <img src="https://via.placeholder.com/200" alt="Mazda 2">
        <h3>Mazda 2</h3>
        <p>Rp 500.000 / hari</p>
    </div>

    <div>
        <img src="https://via.placeholder.com/200" alt="Mazda 3">
        <h3>Mazda 3</h3>
        <p>Rp 650.000 / hari</p>
    </div>

    <div>
        <img src="https://via.placeholder.com/200" alt="Mazda MX-5">
        <h3>Mazda MX-5</h3>
        <p>Rp 1.500.000 / hari</p>
    </div>

    <div>
        <img src="https://via.placeholder.com/200" alt="Mazda 6">
        <h3>Mazda 6</h3>
        <p>Rp 950.000 / hari</p>
    </div>

    <div>
        <img src="https://via.placeholder.com/200" alt="Mazda RX-7">
        <h3>Mazda RX-7</h3>
        <p>Rp 2.500.000 / hari</p>
    </div>

</body>
</html>
